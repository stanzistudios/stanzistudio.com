  <style>
    :root { --navy: #0B1026; --ink: #F4F1EA; --ink-55: rgba(244,241,234,.55); --ink-35: rgba(244,241,234,.35); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100svh; background: var(--navy); color: var(--ink);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; padding: 4rem clamp(1.5rem, 5vw, 5.5rem);
      font-family: "Oswald", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased;

    h1 {
      font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;

      text-transform: uppercase; letter-spacing: -.02em;
      font-size: clamp(2.6rem, 10vw, 7rem); line-height: .95; text-wrap: balance;
    }
    p {
      margin-top: clamp(1.5rem, 3vh, 2.5rem); font-weight: 300;
      font-size: clamp(.95rem, 1.4vw, 1.1rem); letter-spacing: .06em;
      line-height: 1.8; color: var(--ink-55); max-width: 34rem;
    }
    a.home {
      display: inline-block; margin-top: clamp(2.5rem, 6vh, 4rem);
      font-weight: 300; font-size: clamp(1rem, 2.2vw, 1.5rem);
      letter-spacing: .18em; text-transform: uppercase;
      color: var(--ink); text-decoration: none;
      border-bottom: 1px solid var(--ink-35); padding-bottom: .4rem;
      transition: border-color .3s;
    }
    a.home:hover { border-color: var(--ink); }
    .foot {
      position: fixed; bottom: 1.75rem; left: 0; right: 0;
      font-size: .7rem; font-weight: 300; letter-spacing: .2em;
      text-transform: uppercase; color: var(--ink-35);
    }
